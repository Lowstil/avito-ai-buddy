  </defs>
  <!-- Background Circle -->
  <circle cx="64" cy="64" r="64" fill="url(#bg-arseniy)"/>
  <circle cx="64" cy="64" r="61" fill="none" stroke="#04E061" stroke-width="2.5" opacity="0.6"/>
  
  <!-- Hoodie / Clothes -->
  <path d="M22 128 C22 96, 42 82, 64 82 C86 82, 106 96, 106 128 Z" fill="url(#hoodie)"/>
