  <path d="M42 42 Q52 32 66 34 Q80 36 86 42 Q78 30 64 30 Q48 30 42 42 Z" fill="#44403c"/>

  <!-- Intern Badge Pill -->
  <g transform="translate(42, 108)">
    <rect width="44" height="15" rx="7.5" fill="#04E061" filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.5))"/>
    <text x="22" y="11" font-family="system-ui, sans-serif" font-size="8.5" font-weight="900" fill="#052e16" text-anchor="middle" letter-spacing="0.5">INTERN</text>
