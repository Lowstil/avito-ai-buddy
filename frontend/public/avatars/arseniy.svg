  <path d="M52 86 C52 98, 64 104, 64 104 C64 104, 76 98, 76 86 Z" fill="#0f172a" opacity="0.25"/>
  <path d="M56 100 L56 114 M72 100 L72 114" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Neck -->
  <path d="M54 74 L74 74 L72 88 L56 88 Z" fill="#fbd38d"/>
  
  <!-- Head -->
  <ellipse cx="64" cy="56" rx="22" ry="26" fill="url(#skin)"/>
  
  <!-- Ears -->
  <circle cx="41" cy="57" r="4.5" fill="#fbd38d"/>
  <circle cx="87" cy="57" r="4.5" fill="#fbd38d"/>
  
  <!-- Modern Glasses (Tech Intern style) -->
