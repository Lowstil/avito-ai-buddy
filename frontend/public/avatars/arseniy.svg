  <rect x="67" y="50" width="14" height="11" rx="3" fill="none" stroke="#04E061" stroke-width="2.2"/>
  <line x1="61" y1="55" x2="67" y2="55" stroke="#04E061" stroke-width="2.2"/>
  <line x1="43" y1="54" x2="47" y2="54" stroke="#04E061" stroke-width="2"/>
  <line x1="81" y1="54" x2="85" y2="54" stroke="#04E061" stroke-width="2"/>

  <!-- Eyes -->
  <circle cx="54" cy="55" r="2.5" fill="#0f172a"/>
  <circle cx="74" cy="55" r="2.5" fill="#0f172a"/>
  <circle cx="55" cy="54" r="0.8" fill="#ffffff"/>
  <circle cx="75" cy="54" r="0.8" fill="#ffffff"/>

  <!-- Eyebrows -->
  <path d="M48 47 Q54 44 60 46" stroke="#451a03" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M68 46 Q74 44 80 47" stroke="#451a03" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Nose -->
