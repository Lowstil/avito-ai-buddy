  <path d="M49 48 Q54 45 58 48" stroke="#18181b" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M70 48 Q74 45 79 48" stroke="#18181b" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- Elegant Eyebrows -->
  <path d="M48 43 Q54 40 59 42" stroke="#27272a" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M69 42 Q74 40 80 43" stroke="#27272a" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- Nose -->
