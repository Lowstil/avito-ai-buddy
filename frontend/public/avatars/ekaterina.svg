  <!-- Team Lead Badge Pill -->
  <g transform="translate(36, 108)">
    <rect width="56" height="15" rx="7.5" fill="#965EEB" filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.5))"/>
    <text x="28" y="11" font-family="system-ui, sans-serif" font-size="8.5" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">TEAM LEAD</text>
