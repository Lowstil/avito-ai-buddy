  <circle cx="85" cy="54" r="3.8" fill="#fed7aa"/>
  <circle cx="43" cy="58" r="2" fill="#ffffff"/>
  <circle cx="85" cy="58" r="2" fill="#ffffff"/>

  <!-- Hair (Sleek professional bob / brunette) -->
  <path d="M43 46 C40 26, 52 20, 64 20 C76 20, 88 26, 85 46 C81 38, 72 34, 64 34 C56 34, 47 38, 43 46 Z" fill="#18181b"/>
  <path d="M41 46 C41 62, 45 74, 48 76 C46 64, 44 54, 47 46 Z" fill="#27272a"/>
  <path d="M87 46 C87 62, 83 74, 80 76 C82 64, 84 54, 81 46 Z" fill="#27272a"/>

  <!-- Eyes (Intelligent, leadership look) -->
  <circle cx="54" cy="50" r="2.6" fill="#0f172a"/>
  <circle cx="74" cy="50" r="2.6" fill="#0f172a"/>
  <circle cx="55" cy="49" r="0.9" fill="#ffffff"/>
  <circle cx="75" cy="49" r="0.9" fill="#ffffff"/>
