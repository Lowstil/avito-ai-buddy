      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
    <linearGradient id="skin-ekaterina" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="blazer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#965EEB"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="64" cy="64" r="64" fill="url(#bg-ekaterina)"/>
  <circle cx="64" cy="64" r="61" fill="none" stroke="#965EEB" stroke-width="2.5" opacity="0.6"/>
  
  <!-- Back Hair -->
  <path d="M38 52 C34 76, 36 94, 44 104 C40 86, 44 68, 48 56 Z" fill="#18181b"/>
  <path d="M90 52 C94 76, 92 94, 84 104 C88 86, 84 68, 80 56 Z" fill="#18181b"/>

